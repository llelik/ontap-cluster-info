- hosts: localhost
  connection: local
  gather_facts: no
  vars_prompt:
    - name: input_cluster
      prompt: Please enter cluster hostname/IP
      private: false
    - name: input_username
      prompt: Please enter username
    - name: input_password
      prompt: Please enter password

  tasks:
    - name: Set credentials details
      ansible.builtin.set_fact:
        auth: &auth
          hostname:         "{{ input_cluster }}"
          username:         "{{ input_username }}"
          password:         "{{ input_password }}"
          validate_certs:   false
          use_rest:         Auto
      no_log: true

    - name: Cluster debug
      netapp.ontap.na_ontap_debug:
        <<: *auth
      register: ontap_debug
      ignore_errors: true

    - name: Cluster connect check
      netapp.ontap.na_ontap_rest_info:
        <<: *auth
        use_python_keys:  true
        parameters:
          fields: '*'
        gather_subset:
          - cluster
          - aggregate_info
          - cluster_node_info
          - cluster/metrocluster/svms
          - vserver_info
      register: cls_info
    - debug: var=cls_info
    - debug: var=ontap_debug
