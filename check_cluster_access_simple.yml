- hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Set credentials details
      ansible.builtin.set_fact:
        auth: &auth
          hostname:         "{{ input_cluster }}"
          username:         "{{ input_username }}"
          password:         "{{ input_password }}"
          validate_certs:   false
          use_rest:         Always
      no_log: true

    - debug: var=vars

    - name: Cluster debug
      netapp.ontap.na_ontap_debug:
        <<: *auth
      register: ontap_debug
      ignore_errors: true

    - name: Cluster connect check
      netapp.ontap.na_ontap_rest_info:
        <<: *auth
        use_python_keys:  true
        parameters:
          fields: '*'
        gather_subset:
          - cluster
          # - aggregate_info
          # - cluster_node_info
          # - cluster/metrocluster/svms
          # - vserver_info
      register: cls_info
    - debug: var=cls_info
    # - debug: var=ontap_debug
    - debug: var=vars.payload_data
      when: vars.payload_data is defined
